name: QA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.32.0"

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --coverage

      - name: Coverage gate
        run: |
          lcov --remove coverage/lcov.info \
            '**/*.g.dart' \
            'lib/data/local/tables.dart' \
            'lib/l10n/*' \
            -o coverage/lcov.info
          python3 - <<'PY'
          from pathlib import Path
          lf = lh = 0
          for line in Path("coverage/lcov.info").read_text().splitlines():
              if line.startswith("LF:"):
                  lf += int(line[3:])
              elif line.startswith("LH:"):
                  lh += int(line[3:])
          pct = 100 * lh / lf if lf else 0
          print(f"Coverage: {pct:.1f}% ({lh}/{lf})")
          if pct < 100:
              raise SystemExit(f"Coverage {pct:.1f}% below 100% gate")
          PY
